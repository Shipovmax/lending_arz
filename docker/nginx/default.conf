server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html;
    client_max_body_size 64m;

    location ~ ^/(bitrix/(modules|local_cache|stack_cache|managed_cache|php_interface|backup|\.settings)|local/(modules|php_interface)|upload/support/not_image)/ {
        deny all;
    }
    location ~ /\.(?!well-known(?:/|$)) { deny all; }
    location ~* ^/upload/.*\.php$ { deny all; }

    location / {
        try_files $uri $uri/ @bitrix;
    }

    location @bitrix {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        try_files $uri @bitrix;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~* \.(css|js|svg|png|jpe?g|gif|ico|webp|woff2?)$ {
        expires 1h;
        access_log off;
        try_files $uri @bitrix;
    }
}
