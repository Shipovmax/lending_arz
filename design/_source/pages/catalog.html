<!-- meta: Спорттовары — каталог — Мир спорта | Каталог спорттоваров и товаров для рыбалки: одежда, обувь, инвентарь, снасти. | none -->
<!-- Bitrix: bitrix:catalog (section) + bitrix:catalog.smart.filter. Counts in the filter come from the smart filter, not from markup. -->
<div class="container page page--tight">
  <nav aria-label="Хлебные крошки">
    <ol class="breadcrumbs"><li><a class="link-u" href="index.html">Главная</a></li><li><a class="link-u" href="catalog.html">Каталог</a></li><li aria-current="page" data-dir-crumb>Спорттовары</li></ol>
  </nav>

  <div class="catalog-head">
    <h1 class="page-title" data-dir-title>Спорттовары</h1>
    <span class="muted small"><span data-count>0</span> товаров</span>
  </div>

  <div class="toolbar">
    <div class="toolbar__group toolbar__group--quick">
      <button class="pill pill--keep filters-toggle" type="button" aria-expanded="false" aria-controls="filters" data-filters-toggle><svg class="icon icon--sm"><use href="#i-filter"/></svg>Фильтры<span data-filter-badge></span></button>
      <button class="pill pill--keep" type="button" aria-pressed="false" data-quick="stock">В наличии в Арзамасе</button>
      <button class="pill" type="button" aria-pressed="false" data-quick="sale">Только со скидкой</button>
    </div>
    <label class="sort">Сортировка
      <select class="select" name="sort">
        <option>Популярные</option><option>Сначала дешевле</option><option>Сначала дороже</option><option>Новинки</option>
      </select>
    </label>
  </div>

  <div class="catalog-layout">
    <aside class="filters" id="filters" aria-label="Фильтры" data-filters>
      <div class="fgroup">
        <span class="fgroup__title fgroup__title--line">Направление</span>
        <button class="dir-btn" type="button" aria-pressed="true" data-dir="sport">Спорттовары <span>[N]</span></button>
        <button class="dir-btn" type="button" aria-pressed="false" data-dir="fish">Рыбалка <span>[N]</span></button>
        <button class="dir-btn" type="button" aria-pressed="false" data-dir="all">Все товары <span>10 000+</span></button>
      </div>

      <fieldset class="fgroup">
        <legend>Категория</legend>
        <label class="check"><input type="checkbox">Мужская одежда<span class="check__count">[N]</span></label>
        <label class="check"><input type="checkbox">Женская одежда<span class="check__count">[N]</span></label>
        <label class="check"><input type="checkbox">Подростковая одежда<span class="check__count">[N]</span></label>
        <label class="check"><input type="checkbox">Обувь<span class="check__count">[N]</span></label>
        <label class="check"><input type="checkbox">Мячи и инвентарь<span class="check__count">[N]</span></label>
        <button class="more-btn" type="button">Показать ещё</button>
      </fieldset>

      <fieldset class="fgroup">
        <legend>Цена, ₽</legend>
        <div class="price-range">
          <input class="input" type="number" inputmode="numeric" aria-label="Цена от" placeholder="от 149">
          <input class="input" type="number" inputmode="numeric" aria-label="Цена до" placeholder="до 24 990">
        </div>
      </fieldset>

      <fieldset class="fgroup">
        <legend>Размер (RU)</legend>
        <div class="size-grid" data-size-filter>
          <button class="pill" type="button" aria-pressed="false" data-size="40">40</button><button class="pill" type="button" aria-pressed="false" data-size="41">41</button><button class="pill" type="button" aria-pressed="false" data-size="42">42</button><button class="pill" type="button" aria-pressed="false" data-size="43">43</button><button class="pill" type="button" aria-pressed="false" data-size="44">44</button><button class="pill" type="button" aria-pressed="false" data-size="46">46</button><button class="pill" type="button" aria-pressed="false" data-size="48">48</button><button class="pill" type="button" aria-pressed="false" data-size="50">50</button>
        </div>
      </fieldset>

      <fieldset class="fgroup">
        <legend>Цвет</legend>
        <label class="check"><input type="checkbox"><span class="swatch-dot" style="background:#111"></span>Чёрный<span class="check__count">[N]</span></label>
        <label class="check"><input type="checkbox"><span class="swatch-dot" style="background:#fff"></span>Белый<span class="check__count">[N]</span></label>
        <label class="check"><input type="checkbox"><span class="swatch-dot" style="background:#1d4ed8"></span>Синий<span class="check__count">[N]</span></label>
        <label class="check"><input type="checkbox"><span class="swatch-dot" style="background:#8c8c8c"></span>Серый<span class="check__count">[N]</span></label>
        <button class="more-btn" type="button">Показать ещё</button>
      </fieldset>

      <fieldset class="fgroup">
        <legend>Бренд</legend>
        <label class="check"><input type="checkbox">[Бренд 1]<span class="check__count">[N]</span></label>
        <label class="check"><input type="checkbox">[Бренд 2]<span class="check__count">[N]</span></label>
        <label class="check"><input type="checkbox">[Бренд 3]<span class="check__count">[N]</span></label>
        <button class="more-btn" type="button">Показать ещё</button>
      </fieldset>

      <button class="btn btn--sm" type="button" data-filters-reset>Сбросить фильтры</button>
    </aside>

    <div class="catalog-main">
      <div class="chips" data-chips hidden></div>
      <div class="product-grid" data-grid>
<!--CARDS:catalog-->
      </div>
      <div class="empty" hidden data-empty>
        <span class="empty__title">Ничего не нашлось</span>
        <span class="muted">Уберите часть фильтров или выберите другое направление.</span>
        <button class="btn btn--sm" type="button" data-filters-reset>Сбросить фильтры</button>
      </div>
      <div class="pager">
        <button class="btn" type="button">Показать ещё 24 товара</button>
        <nav aria-label="Страницы">
          <ol class="pagination"><li><a href="catalog.html" aria-current="page">1</a></li><li><a href="catalog.html">2</a></li><li><a href="catalog.html">3</a></li><li><span>…</span></li><li><a href="catalog.html">[N]</a></li></ol>
        </nav>
      </div>
    </div>
  </div>
</div>
